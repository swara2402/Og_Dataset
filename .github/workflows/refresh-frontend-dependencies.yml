name: Refresh frontend dependencies

on:
  push:
    branches: [security/frontend-deps]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: update frontend dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/frontend-deps
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade vulnerable frontend tooling
        working-directory: frontend
        run: |
          npm install --save-dev "vite@^8.3.5" "@vitejs/plugin-react@^6.2.1" "@typescript-eslint/eslint-plugin@^8.72.1" "@typescript-eslint/parser@^8.72.1"
          npm audit fix
      - name: Require clean dependency audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: update frontend dependencies"
          git push origin security/frontend-deps
